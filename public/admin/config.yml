backend:
  name: github
  repo: ishtiakalamrafid/vnv-site
  base_url: https://api.netlify.com
  auth_endpoint: auth

media_folder: public/images/posts
public_folder: /images/posts

collections:
  - name: posts
    label: Articles
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime }
      - { label: Category, name: category, widget: select, options: [Rundown, Under the Hood, Build Logs, Competition Watch, Bio-Inspired Corner, Field Notes, Take a Stand, Guest Voices] }
      - { label: Author, name: author, widget: string, default: ishtiak-alam-rafid }
      - { label: Tags, name: tags, widget: list }
      - { label: Description, name: description, widget: string }
      - { label: Featured Image, name: image, widget: image }
      - { label: Body, name: body, widget: markdown }